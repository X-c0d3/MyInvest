# MyInvest on a VPS. The app listens on port 3004 of the host.
#   1. cp .env.example .env
#   2. docker compose up -d --build                    -> http://<vps>:3004 (put your own HTTPS proxy in front)
#   or docker compose --profile caddy up -d --build    -> also runs Caddy for HTTPS on $DOMAIN (needs ports 80/443)

services:
  app:
    build: .
    image: myinvest:latest
    restart: unless-stopped
    environment:
      # Sign-up is open only until the first account exists; set true to add more users, then back.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Keep true behind HTTPS. Only set false for a plain-http test.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - myinvest-data:/app/data
    ports:
      - "${APP_PORT:-3004}:3004"

  # Optional: only starts with --profile caddy.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  myinvest-data:
  caddy-data:
  caddy-config:
